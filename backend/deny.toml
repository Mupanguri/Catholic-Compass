# cargo-deny configuration for Catholic Compass backend
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with known security vulnerabilities
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "workspace"
yanked = "deny"
notice = "warn"
ignore = [
  # Add advisory IDs here to suppress false positives, e.g.:
  # "RUSTSEC-2023-0001",
]

[licenses]
# Allow OSI-approved permissive licences; deny GPL and AGPL in dependencies
unlicensed = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "OpenSSL",
]
deny = [
  "GPL-2.0",
  "GPL-3.0",
  "AGPL-3.0",
  "LGPL-2.0",
  "LGPL-2.1",
  "LGPL-3.0",
]
copyleft = "warn"

[[licenses.clarify]]
# ring uses a non-standard licence expression; clarify it
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Prevent duplicate major versions of critical crates
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
# Only allow crates from crates.io, plus your own git deps
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []